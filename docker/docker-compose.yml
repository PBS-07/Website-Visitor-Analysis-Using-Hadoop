version: '3.8'

services:
  hadoop-cluster:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: website-visitor-hadoop:3.3.6
    container_name: hadoop-cluster
    hostname: hadoop
    ports:
      - "9870:9870"   # HDFS NameNode Web UI
      - "9000:9000"   # HDFS IPC
      - "8088:8088"   # YARN ResourceManager Web UI
      - "8042:8042"   # YARN NodeManager Web UI
      - "10000:10000" # Apache Hive JDBC / Thrift
      - "10002:10002" # Apache HiveServer2 Web UI
    volumes:
      - ../:/workspace
      - hadoop_namenode:/opt/hadoop/data/dfs/name
      - hadoop_datanode:/opt/hadoop/data/dfs/data
    environment:
      - HADOOP_HOME=/opt/hadoop
      - HIVE_HOME=/opt/hive
      - JAVA_HOME=/opt/java/openjdk
    deploy:
      resources:
        limits:
          memory: 8192M
    restart: unless-stopped

volumes:
  hadoop_namenode:
    driver: local
  hadoop_datanode:
    driver: local

